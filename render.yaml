# Render Blueprint — provisions the full backend stack:
#   • ecomm-postgres  — managed Postgres (free)
#   • ecomm-redis     — managed Key Value / Redis (cache, rate limiter, idempotency, BullMQ)
#   • ecomm-api       — Express API web service (free)
#   • ecomm-worker    — BullMQ background worker (outbox dispatcher + queues; paid, no free tier)
#
# The Next.js frontend (apps/web) deploys separately on Vercel.
#
# Apply via: Render dashboard → New → Blueprint → point at this repo.
# Docs: https://render.com/docs/blueprint-spec
#
# After first deploy:
#   1. In the `ecomm-api` service → Environment, fill every `sync: false` value
#      (Cloudinary creds, Stripe keys, WEB_ORIGINS = your Vercel origin).
#   2. In the `ecomm-worker` service → Environment, fill STRIPE_SECRET_KEY
#      (same key as the API — used by the reconciliation job).
#   3. Add a Stripe webhook pointing at https://<api-service>.onrender.com/payments/webhook
#      and copy its signing secret into the API's STRIPE_WEBHOOK_SECRET.

databases:
  - name: ecomm-postgres
    plan: free
    databaseName: ecomm
    user: ecomm

services:
  - type: web
    name: ecomm-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # Install at the repo root so npm workspaces can hoist + symlink @repo/*.
    # `prisma generate` runs automatically via packages/db postinstall.
    buildCommand: npm ci && npm run build:api
    startCommand: npm run db:migrate:deploy && npm run db:seed && npm run start:api
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.19.0"
      - key: DATABASE_URL
        fromDatabase:
          name: ecomm-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ecomm-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_NAME
        value: ecomm_auth
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: WEB_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: ecomm/products
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: USD

  # ── Managed Key Value (Redis) ─────────────────────────────────────────────
  # Backs the cache, token-bucket rate limiter, idempotency hot path, and BullMQ
  # queues. ipAllowList: [] keeps it private — reachable only by the API and
  # worker over Render's internal network. noeviction protects queue jobs and
  # idempotency claims from being dropped under memory pressure; the cache layer
  # tolerates write failures and falls back to Postgres.
  - type: keyvalue
    name: ecomm-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # ── Background worker ─────────────────────────────────────────────────────
  # Runs the outbox dispatcher + 5 BullMQ workers (ledger, reconciliation,
  # emails, webhook retry, inventory sweep). Workers have no free tier on Render.
  # Does NOT run migrations — the API service owns migrate:deploy + seed.
  - type: worker
    name: ecomm-worker
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    rootDir: .
    buildCommand: npm ci && npm run build:worker
    startCommand: npm run start:worker
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.19.0"
      - key: DATABASE_URL
        fromDatabase:
          name: ecomm-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ecomm-redis
          type: keyvalue
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
