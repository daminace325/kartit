# Render Blueprint — provisions the free-tier backend:
#   • ecomm-postgres  — managed Postgres (free)
#   • ecomm-redis     — managed Key Value / Redis (cache, rate limiter, idempotency)
#   • ecomm-api       — Express API web service (free)
#
# Render has no free tier for background workers. For a free deploy, run it locally
# against this Postgres when you need the ledger/reconciliation flow, or
# uncomment the block to deploy it as a paid service.
#
# The Next.js frontend (apps/web) deploys separately on Vercel.
#
# Apply via: Render dashboard → New → Blueprint → point at this repo.
# Docs: https://render.com/docs/blueprint-spec
#
# After first deploy:
#   1. In the `ecomm-api` service → Environment, fill every `sync: false` value
#      (Cloudinary creds, Stripe keys, WEB_ORIGINS = your Vercel origin).
#   2. Add a Stripe webhook pointing at https://<api-service>.onrender.com/payments/webhook
#      and copy its signing secret into the API's STRIPE_WEBHOOK_SECRET.

databases:
  - name: ecomm-postgres
    plan: free
    databaseName: ecomm
    user: ecomm

services:
  - type: web
    name: ecomm-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # Install at the repo root so npm workspaces can hoist + symlink @repo/*.
    # --include=dev is required: NODE_ENV=production (below) would otherwise make
    # npm skip devDependencies (typescript + @types/*) and break the tsc build.
    # `prisma generate` runs automatically via packages/db postinstall.
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm run db:migrate:deploy && npm run db:seed && npm run start:api
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.19.0"
      - key: DATABASE_URL
        fromDatabase:
          name: ecomm-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ecomm-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_NAME
        value: ecomm_auth
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: WEB_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: ecomm/products
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: USD

  # ── Managed Key Value (Redis) ─────────────────────────────────────────────
  # Backs the cache, token-bucket rate limiter, idempotency hot path, and BullMQ
  # queues. ipAllowList: [] keeps it private — reachable only by the API and
  # worker over Render's internal network. noeviction protects queue jobs and
  # idempotency claims from being dropped under memory pressure; the cache layer
  # tolerates write failures and falls back to Postgres.
  - type: keyvalue
    name: ecomm-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []
